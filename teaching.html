<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Resources — Paolo Tartarelli</title>

  <style>

    :root {
      --blue: #264653;
      --blue-light: #486b75;
      --black: #171717;
      --grey: #707679;
      --background: #f7f8f7;
      --light-grey: #dfe3e3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 85px 40px 60px 40px;
    }

    .back {
      display: inline-block;
      margin-bottom: 70px;
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: 0.2s ease;
    }

    .back:hover {
      color: var(--blue-light);
      border-bottom-color: var(--blue-light);
    }

    h1 {
      font-size: 42px;
      line-height: 1.1;
      letter-spacing: -1px;
      font-weight: 500;
      margin: 0 0 35px 0;
      color: var(--blue);
    }

    .content {
      font-size: 16px;
      color: var(--grey);
    }

    footer {
      margin-top: 100px;
      padding-top: 22px;
      border-top: 1px solid var(--light-grey);
      color: #929799;
      font-size: 12px;
    }

    @media (max-width: 760px) {

      .container {
        padding: 45px 25px;
      }

      h1 {
        font-size: 36px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <a href="index.html" class="back">
    ← Research
  </a>

  <h1>Resources</h1>

  <div class="content">
    Available soon.
  </div>

  <footer>
    Paolo Tartarelli
  </footer>

</div>

</body>

</html>
